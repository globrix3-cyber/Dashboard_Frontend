<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Warm dark background -->
  <rect width="32" height="32" rx="7" fill="#1C1815"/>

  <!-- G letterform: arc from ~2-o'clock position, counterclockwise
       over the top → left side → under the bottom → to 3-o'clock.
       Drawn as SVG path (not <text>) so it renders crisp at any size. -->
  <path
    d="M21 7.34 A10 10 0 1 0 26 16"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- Crossbar: saffron brand colour, extends inward from the arc end -->
  <line x1="26" y1="16" x2="19" y2="16"
    stroke="#C4773A"
    stroke-width="4.5"
    stroke-linecap="round"
  />
</svg>
